<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ 'index, follow, max-image-preview:large' if indexable else 'noindex' }}">
{% if indexable %}<link rel="canonical" href="{{ canonical }}">{% endif %}
<meta name="theme-color" content="#315747">
<link rel="icon" href="{{ site }}/favicon.ico">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:locale" content="te_IN">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ image }}">
<meta name="twitter:card" content="summary_large_image">
{% if jsonld %}<script type="application/ld+json">{{ jsonld|safe }}</script>{% endif %}
<style>
:root{--bg:#F7F6F1;--ink:#2A1C10;--muted:#6b6257;--brand:#315747;--line:#e2ded3;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Noto Sans Telugu","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--brand)}
img{display:block;width:100%;height:auto}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.brand{font-weight:700;font-size:21px;color:var(--ink);text-decoration:none;margin-right:auto}
nav a{margin-right:16px;text-decoration:none;white-space:nowrap}
.btn{display:inline-block;background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:600}
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:32px;line-height:1.3;margin:12px 0 4px}
h2{font-size:23px;line-height:1.35;margin:36px 0 12px}
.sub{color:var(--muted);margin:0 0 12px}
.small{font-size:15px;color:var(--muted)}
.crumbs{font-size:14px;color:var(--muted);margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);display:block}
.card img{aspect-ratio:1/1;object-fit:cover}
.card div{padding:8px 10px 10px;line-height:1.4}
.card strong{display:block}
.cols{display:grid;gap:24px}
@media(min-width:720px){.cols{grid-template-columns:280px 1fr}h1{font-size:38px}}
.cover{border-radius:12px;max-width:320px}
ol.list,ul.list{list-style:none;padding:0;margin:0}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list a{font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:32px}
footer{border-top:1px solid var(--line);padding:20px 16px;text-align:center;font-size:14px;color:var(--muted)}
footer a{margin:0 8px}
</style>
</head>
<body>
<header class="top"><div class="bar">
<a class="brand" href="{{ site }}/">{{ site_name }}</a>
<nav aria-label="Main"><a href="{{ site }}/books">నవలలు</a><a href="{{ site }}/collections">సంపుటాలు</a><a href="{{ site }}/stories">కథలు</a></nav>
<a class="btn" href="{{ app }}/">యాప్ తెరవండి</a>
</div></header>
<main>{% block main %}{% endblock %}</main>
<footer>© {{ site_name }} · వినదగిన కథలు<br><a href="{{ app }}/privacy">Privacy</a><a href="{{ app }}/terms">Terms</a></footer>
</body>
</html>
