name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kathachepta
          POSTGRES_USER: kathachepta
          POSTGRES_PASSWORD: kathachepta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kathachepta" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KC_DATABASE_URL: postgresql+psycopg://kathachepta:kathachepta@localhost:5432/kathachepta
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: ruff check kc_worker tests --select E,F,W --ignore E501
      - run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in web/app.js web/editor/editor.js web/narrator/narrator.js; do node --check "$f"; done

  images:
    runs-on: ubuntu-latest
    needs: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t kathachepta-api .
      - run: docker build -f worker/Dockerfile -t kathachepta-worker .
